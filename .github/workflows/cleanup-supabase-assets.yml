name: Cleanup unused Supabase assets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List orphans without deleting"
        required: false
        default: "true"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  cleanup:
    name: Delete unreferenced storage objects
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run asset cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm run cleanup:assets:dry
          else
            npm run cleanup:assets
          fi
